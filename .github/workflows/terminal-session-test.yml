name: Terminal Session Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/terminal-session-test.yml
      - server/**

permissions:
  contents: read

jobs:
  terminal-session:
    name: Terminal session tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test terminal sessions
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: >-
          go test service/vm/terminal.go
          service/vm/terminal_session.go
          service/vm/service.go
          service/vm/terminal_test.go
