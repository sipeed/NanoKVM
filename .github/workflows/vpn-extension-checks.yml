name: VPN extension checks

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/vpn-extension-checks.yml
      # Any server change can affect these packages through shared code.
      - server/**
      - kvmapp/system/init.d/S95nanokvm
      - kvmapp/system/init.d/S98tailscaled
      - kvmapp/system/init.d/S99netbird
      - kvmapp/system/init.d/tests/test_vpn_init_scripts.sh
      - kvmapp/system/netbird/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test VPN extensions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check VPN init script syntax
        working-directory: .
        run: |
          for shell in bash dash; do
            "$shell" -n kvmapp/system/init.d/S95nanokvm
            "$shell" -n kvmapp/system/init.d/S98tailscaled
            "$shell" -n kvmapp/system/init.d/S99netbird
          done

      - name: Run VPN init script regression tests
        working-directory: .
        run: dash kvmapp/system/init.d/tests/test_vpn_init_scripts.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Go vet
        run: >-
          go vet
          ./service/extensions/vpnpref
          ./service/extensions/tailscale
          ./service/extensions/netbird
          ./service/extensions/vpn

      - name: Go test
        run: >-
          go test -count=1 -race
          ./service/extensions/vpnpref
          ./service/extensions/tailscale
          ./service/extensions/netbird
          ./service/extensions/vpn
